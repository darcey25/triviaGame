<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivia Game!</title>
  <link rel="stylesheet" type="text/css" href="assets/css/style.css">
  <link rel="stylesheet" type="text/css" href="assets/css/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js" integrity="sha384-5AkRS45j4ukf+JbWAfHL8P4onPA9p0KwwP7pUdjSQA3ss9edbJUJc/XcYAiheSSz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div id="title">
      <h1><strong>Geography Trivia Game</strong></h1>
    </div>
    <div id="clock">
      <div class="p1"><strong>Ready to test your geography knowledge?</strong></div>
    </div>
    <div id="question" >
      <p><strong class="correct">Good Luck!</strong></p>
    </div>
    <div id="answers">
      <img id="image" src="assets/images/placehoder.jpg" hidden="" >
      <div id="results"></div>
      <button type="button" class="btn btn-secondary btn-lg answer" id="answer1" hidden="" value="1">houston</button>
      <button type="button" class="btn btn-secondary btn-lg answer" id="answer2" hidden="" value="2" >Dallas</button>
      <button type="button" class="btn btn-secondary btn-lg answer" id="answer3" hidden="" value="3">Austin</button>
      <button type="button" class="btn btn-secondary btn-lg answer" id="answer4" hidden="" value="4">El Paso</button>
      <button type="button" class="btn btn-secondary btn-lg" id="start">Start Game</button>
      <button type="button" class="btn btn-secondary btn-lg" id="playAgain" hidden="">Play again</button>
    </div>
    
  </div>








  <script type="text/javascript" src="assets/javascript/app.js"></script>
</body>
</html>
